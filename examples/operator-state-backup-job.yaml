# Example Job: backup Backrest host PVC + critical Secrets to a restic repo.
# Customize repository URL/password Secret before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: backrest-operator-state-backup
  namespace: backrest-system
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: backup
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p /out
              kubectl get secret -n backrest-system -o yaml > /out/secrets.yaml
              kubectl get cm backrest-plans -n backrest-system -o yaml > /out/plans.yaml || true
              kubectl get backrestcluster,backuprepository,backupplan -A -o yaml > /out/crs.yaml
              echo "State manifests written under /out — pipe to restic or copy off-cluster."
              ls -la /out
          volumeMounts:
            - name: out
              mountPath: /out
      volumes:
        - name: out
          emptyDir: {}
