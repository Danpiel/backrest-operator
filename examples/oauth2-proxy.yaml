# Example oauth2-proxy in reverse-proxy mode in front of Backrest UI (HTTPS).
# Create Secret backrest-oauth2 with keys: client-id, client-secret, cookie-secret.
#
# OIDC redirect URI (Pocket ID / IdP):
#   https://backrest.example.com/oauth2/callback
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backrest-oauth2-proxy
  namespace: backrest-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backrest-oauth2-proxy
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backrest-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backrest-oauth2-proxy
    spec:
      serviceAccountName: backrest-oauth2-proxy
      enableServiceLinks: false
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          args:
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --provider=oidc
            - --oidc-issuer-url=https://auth.example.com
            - --redirect-url=https://backrest.example.com/oauth2/callback
            - --upstream=http://backrest-host-main.backrest-system.svc.cluster.local:9898/
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-name=_backrest_oauth2
            - --cookie-domain=.example.com
            - --whitelist-domain=backrest.example.com
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --scope=openid email profile
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backrest-oauth2
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backrest-oauth2
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: backrest-oauth2
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: backrest-oauth2-proxy
  namespace: backrest-system
spec:
  selector:
    app.kubernetes.io/name: backrest-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
