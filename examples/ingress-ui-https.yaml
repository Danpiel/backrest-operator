# Example: expose Backrest UI over HTTPS with cert-manager + Traefik.
# Replace hostnames, issuer, and IngressClass for your cluster.
#
# Pocket ID / OIDC redirect URI must match:
#   https://backrest.example.com/oauth2/callback
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backrest-ui
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: backrest-operator
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - backrest.example.com
      secretName: backrest-example-com-tls
  rules:
    - host: backrest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # oauth2-proxy reverse-proxy in front of Backrest (recommended),
                # or point directly at backrest-host-main:9898 if auth is handled elsewhere.
                name: backrest-oauth2-proxy
                port:
                  number: 4180
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: backrest-https-redirect
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: backrest-operator
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backrest-ui-http-redirect
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: backrest-operator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: backrest-system-backrest-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: backrest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backrest-oauth2-proxy
                port:
                  number: 4180
