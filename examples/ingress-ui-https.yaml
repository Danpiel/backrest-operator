# HTTPS UI via BackrestCluster.spec.host.ingress (operator-owned).
# oauth2-proxy is an optional companion Service; point backendServiceName at it.
# See also examples/oauth2-proxy.yaml for the IdP frontend Deployment.
apiVersion: operator.backrest.io/v1alpha1
kind: BackrestCluster
metadata:
  name: main
  namespace: backrest-system
spec:
  version: v1.14.1
  image: ghcr.io/garethgeorge/backrest
  host:
    replicas: 1
    serviceType: ClusterIP
    enableServiceLinks: false
    ingress:
      enabled: true
      className: traefik
      host: backrest.example.com
      # Optional: terminate auth at oauth2-proxy instead of the Backrest Service.
      backendServiceName: backrest-oauth2-proxy
      backendServicePort: 4180
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        - hosts:
            - backrest.example.com
          secretName: backrest-example-com-tls
    persistence:
      size: 20Gi
      storageClassName: standard
  agents:
    enabled: true
    mode: DaemonSet
    multihost:
      permissions:
        - ReadOperations
        - ReceiveSharedRepos
  auth:
    enabled: false
  monitoring:
    enabled: true
  mcp:
    enabled: true
---
# Optional Traefik-only HTTP→HTTPS redirect (not part of BackrestCluster).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: backrest-https-redirect
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/part-of: backrest-operator
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backrest-ui-http-redirect
  namespace: backrest-system
  labels:
    app.kubernetes.io/name: backrest
    app.kubernetes.io/part-of: backrest-operator
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: backrest-system-backrest-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: backrest.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backrest-oauth2-proxy
                port:
                  number: 4180
