apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: snapshotdownloads.operator.backrest.io
  labels:
    app.kubernetes.io/name: backrest-operator
    app.kubernetes.io/component: crd
spec:
  group: operator.backrest.io
  scope: Namespaced
  names:
    plural: snapshotdownloads
    singular: snapshotdownload
    kind: SnapshotDownload
    shortNames:
      - snapdl
      - sdl
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - repositoryRef
                - snapshotID
              properties:
                repositoryRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                snapshotID:
                  type: string
                  minLength: 1
                path:
                  type: string
                  default: /
                  description: Path inside the snapshot; "/" streams the whole snapshot as .tar
                planID:
                  type: string
                publicBaseURL:
                  type: string
                  description: Optional HTTPS base (default BACKREST_PUBLIC_BASE_URL)
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Ready
                    - Failed
                downloadURL:
                  type: string
                  description: Absolute HTTPS URL ready to curl -L
                relativeURL:
                  type: string
                operationID:
                  type: integer
                  format: int64
                snapshotID:
                  type: string
                path:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                lastRefresh:
                  type: string
                  format: date-time
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Download URL
          type: string
          jsonPath: .status.downloadURL
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
