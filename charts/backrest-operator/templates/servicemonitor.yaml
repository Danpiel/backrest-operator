{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "backrest-operator.fullname" . }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "backrest-operator.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "backrest-operator.namespace" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- if .Values.mcp.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-mcp" (include "backrest-operator.fullname" .) }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.mcpLabels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "backrest-operator.mcpSelectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "backrest-operator.namespace" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
