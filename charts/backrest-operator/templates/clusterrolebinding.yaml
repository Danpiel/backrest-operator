{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backrest-operator.operatorClusterRoleName" . }}
  labels:
    {{- include "backrest-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backrest-operator.operatorClusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backrest-operator.operatorServiceAccountName" . }}
    namespace: {{ include "backrest-operator.namespace" . }}
{{- if .Values.mcp.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backrest-operator.mcpClusterRoleName" . }}
  labels:
    {{- include "backrest-operator.mcpLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backrest-operator.mcpClusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backrest-operator.mcpServiceAccountName" . }}
    namespace: {{ include "backrest-operator.namespace" . }}
{{- end }}
{{- end }}
