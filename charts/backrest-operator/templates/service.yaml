apiVersion: v1
kind: Service
metadata:
  name: {{ include "backrest-operator.fullname" . }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "backrest-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.operator.metrics.port }}
      targetPort: metrics
      protocol: TCP
---
{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mcp" (include "backrest-operator.fullname" .) }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.mcpLabels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    {{- include "backrest-operator.mcpSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.mcp.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
{{- end }}
