apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backrest-operator.fullname" . }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "backrest-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "backrest-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backrest-operator.operatorServiceAccountName" . }}
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "backrest-operator.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          {{- with .Values.operator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: WATCH_NAMESPACES
              value: {{ include "backrest-operator.watchNamespaces" . | quote }}
            - name: WATCH_LABEL_SELECTOR
              value: {{ .Values.operator.watch.labelSelector | quote }}
            - name: DEFAULT_BACKREST_IMAGE
              value: {{ include "backrest-operator.backrestImage" . | quote }}
            - name: OPERATOR_IMAGE
              value: {{ include "backrest-operator.operatorImage" . | quote }}
            - name: EXPORT_PROXY_IMAGE
              value: {{ include "backrest-operator.operatorImage" . | quote }}
            - name: METRICS_PORT
              value: {{ .Values.operator.metrics.port | quote }}
            - name: WEBHOOK_ENABLED
              value: {{ .Values.operator.webhook.enabled | quote }}
            - name: WEBHOOK_PORT
              value: {{ .Values.operator.webhook.port | quote }}
            - name: WEBHOOK_CERT
              value: /tls/tls.crt
            - name: WEBHOOK_KEY
              value: /tls/tls.key
            - name: LOG_FORMAT
              value: {{ .Values.operator.logging.format | default "console" | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.operator.logging.level | default "info" | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.operator.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.operator.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.operator.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: /tls
              readOnly: true
          {{- end }}
      {{- if .Values.operator.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "backrest-operator.webhookCertSecretName" . }}
            optional: false
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
