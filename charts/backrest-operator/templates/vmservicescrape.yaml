{{- if .Values.monitoring.vmServiceScrape.enabled }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "backrest-operator.fullname" . }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.labels" . | nindent 4 }}
    {{- with .Values.monitoring.vmServiceScrape.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "backrest-operator.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "backrest-operator.namespace" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.vmServiceScrape.interval }}
      scrapeTimeout: {{ .Values.monitoring.vmServiceScrape.scrapeTimeout }}
{{- if .Values.mcp.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ printf "%s-mcp" (include "backrest-operator.fullname" .) }}
  namespace: {{ include "backrest-operator.namespace" . }}
  labels:
    {{- include "backrest-operator.mcpLabels" . | nindent 4 }}
    {{- with .Values.monitoring.vmServiceScrape.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "backrest-operator.mcpSelectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ include "backrest-operator.namespace" . }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.vmServiceScrape.interval }}
      scrapeTimeout: {{ .Values.monitoring.vmServiceScrape.scrapeTimeout }}
{{- end }}
{{- end }}
