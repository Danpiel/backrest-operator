apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupplans.operator.backrest.io
  labels:
    app.kubernetes.io/name: backrest-operator
    app.kubernetes.io/component: crd
spec:
  group: operator.backrest.io
  scope: Namespaced
  names:
    plural: backupplans
    singular: backupplan
    kind: BackupPlan
    shortNames:
      - bkplan
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - repositoryRef
                - paths
              properties:
                repositoryRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                clusterRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                schedule:
                  type: string
                  description: >-
                    Cron schedule. Empty means manual / on-demand backups only.
                paths:
                  type: array
                  minItems: 1
                  items:
                    type: string
                excludes:
                  type: array
                  items:
                    type: string
                retention:
                  type: object
                  properties:
                    keepLast:
                      type: integer
                      format: int32
                      minimum: 0
                    keepDaily:
                      type: integer
                      format: int32
                      minimum: 0
                    keepWeekly:
                      type: integer
                      format: int32
                      minimum: 0
                    keepMonthly:
                      type: integer
                      format: int32
                      minimum: 0
                    keepYearly:
                      type: integer
                      format: int32
                      minimum: 0
                hooks:
                  type: array
                  description: Backrest/bash hook definitions.
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                tags:
                  type: array
                  items:
                    type: string
                pvcBackupRef:
                  type: object
                  description: Optional link to PVC-centric orchestration.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Ready
                    - Running
                    - Degraded
                    - Failed
                lastBackupTime:
                  type: string
                  format: date-time
                lastSnapshotID:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Last Backup
          type: date
          jsonPath: .status.lastBackupTime
        - name: Snapshot ID
          type: string
          jsonPath: .status.lastSnapshotID
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
