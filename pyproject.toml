[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backrest-operator"
version = "0.1.0"
description = "Kubernetes operator and MCP server for Backrest (restic) backups"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Backrest Operator contributors" }]
dependencies = [
  "kopf>=1.37.0",
  "kubernetes>=29.0.0",
  "prometheus-client>=0.20.0",
  "aiohttp>=3.9.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.0.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
backrest-operator = "backrest_operator.__main__:main"
backrest-mcp = "backrest_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
