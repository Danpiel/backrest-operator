name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o bin/operator ./cmd/operator
      - run: go build -o bin/mcp ./cmd/mcp
      - run: go build -o bin/export-proxy ./cmd/export-proxy

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/backrest-operator
      - run: helm template test charts/backrest-operator >/dev/null

  publish:
    name: publish images & helm
    needs: [go, helm-lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image / chart metadata
        id: meta
        run: |
          set -euo pipefail
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"

          TAGS_OPERATOR=()
          TAGS_MCP=()
          CHART_VERSION=""
          IS_RELEASE=false

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            REF="$SHA_SHORT"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${REF#v}"
            IS_RELEASE=true
            CHART_VERSION="$VERSION"
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:v${VERSION}")
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:latest")
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:sha-${SHA_SHORT}")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:v${VERSION}")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:latest")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:sha-${SHA_SHORT}")
          else
            # branch push (master/main) or dispatch
            CHART_VERSION="0.0.0-${SHA_SHORT}"
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:latest")
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:sha-${SHA_SHORT}")
            TAGS_OPERATOR+=("ghcr.io/${OWNER}/backrest-operator:${REF}")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:latest")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:sha-${SHA_SHORT}")
            TAGS_MCP+=("ghcr.io/${OWNER}/backrest-mcp:${REF}")
          fi

          {
            echo "owner=${OWNER}"
            echo "sha_short=${SHA_SHORT}"
            echo "chart_version=${CHART_VERSION}"
            echo "is_release=${IS_RELEASE}"
            echo "operator_tags<<EOF"
            printf '%s\n' "${TAGS_OPERATOR[@]}"
            echo "EOF"
            echo "mcp_tags<<EOF"
            printf '%s\n' "${TAGS_MCP[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.operator_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.mcp_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm chart
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/backrest-operator \
            --version "${{ steps.meta.outputs.chart_version }}" \
            --appVersion "${{ steps.meta.outputs.chart_version }}" \
            -d dist
          ls -la dist/

      - name: Push Helm chart to GHCR (OCI)
        run: |
          set -euo pipefail
          OWNER="${{ steps.meta.outputs.owner }}"
          CHART=$(ls dist/backrest-operator-*.tgz | head -n1)
          helm push "$CHART" "oci://ghcr.io/${OWNER}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.meta.outputs.chart_version }}
          path: dist/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true
